const iso=date=>[date.getFullYear(),String(date.getMonth()+1).padStart(2,'0'),String(date.getDate()).padStart(2,'0')].join('-');

const clp=value=>new Intl.NumberFormat('es-CL',{style:'currency',currency:'CLP'}).format(value);
const now=()=>new Date().toISOString();
const key='fenix-austral-demo-v1';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);

let db;
try{db=JSON.parse(localStorage.getItem(key))||seed()}catch{db=seed()}
let view={page:'home',mode:'',id:''}, filters={owner:'',pid:'',period:'30'}, calendarMonth=today().slice(0,7), noticeTimer;

const projectName=id=>lookup('projects',id)?.name||'Sin proyecto';
const whoShort=who=>who===jose?'José Luis':who.split(' ')[0];

  try{localStorage.setItem(key,JSON.stringify(db));return true}
  catch{$('notice').textContent='El navegador no permite guardar cambios locales en este archivo.';return false}
}
function notify(message){clearTimeout(noticeTimer);$('notice').textContent=message;noticeTimer=setTimeout(()=>$('notice').textContent='',3600)}

const hashFor=(page,mode='',id='')=>'#'+[page,mode,id].filter(Boolean).join('/');
function route(){
  const [page,mode='',id='']=location.hash.slice(1).split('/');
  view={page:modules[page]?page:'home',mode,id};render();
}
function go(page,mode='',id=''){
  const hash=hashFor(page,mode,id);
  if(location.hash===hash)render();else location.hash=hash;

const badge=(label,alert=false)=>`<span class="badge ${alert?'alert':''}">${esc(label)}</span>`;

const choices=(options,value)=>options.map(option=>{

const projectOptions=label=>[['',label],...db.projects.map(p=>[p.id,p.name])];
function scope(kind,id){
  if(kind==='project')return {label:projectName(id),pid:id,page:'projects',mode:'project',id};
  if(kind==='case'||kind==='money'){
    const item=lookup(kind==='case'?'cases':'money',id);
    return {label:item?.name||'',pid:item?.pid||'',page:kind==='case'?'cases':'finance',mode:kind,id};
  }
  return {label:'Espacio general',pid:'',page:'decisions',mode:'',id:''};
}
const pending=d=>!d.outcome;
const awaits=d=>pending(d)&&d.invited.includes(db.actor)&&(!d.responses[db.actor]||d.responses[db.actor].vote==='Pide antecedentes');
const overdue=t=>t.status!=='Cerrado'&&t.due<today();
const taskStatus=t=>overdue(t)?'Vencido':t.status;
function dashboard(){
  const end=shift(Number(filters.period));
  const start=shift(1-Number(filters.period));
  const matches=(owner,pid)=>(!filters.owner||owner===filters.owner)&&(!filters.pid||pid===filters.pid);
  const tasks=db.tasks.filter(t=>matches(t.owner,t.pid));
  const active=db.projects.filter(p=>p.status==='Activo'&&matches(p.owner,p.id));
  const upcoming=tasks.filter(t=>t.type==='Hito'&&t.status!=='Cerrado'&&t.due>=today()&&t.due<=end).sort((a,b)=>a.due.localeCompare(b.due));
  const late=tasks.filter(t=>t.type==='Compromiso'&&overdue(t)&&t.due>=start).sort((a,b)=>a.due.localeCompare(b.due));
  const decisions=db.decisions.filter(d=>awaits(d)&&d.due<=end&&matches(d.owner,d.pid));
  const list={
    active:['Proyectos activos',active,p=>row(p.name,p.owner,'projects','project',p.id)],
    upcoming:['Hitos próximos',upcoming,taskRow],
    late:['Compromisos vencidos',late,taskRow],
    waiting:['Mis respuestas pendientes',decisions,d=>decisionRow(d)]
  };
  const metric=(id)=>`<button class="card metric" data-jump="${hashFor('home',id)}"><span>${list[id][0]}</span><strong>${list[id][1].length}</strong><small>Ver listado</small></button>`;
  const form=`<div class="card filters">
    <label>Responsable<select data-filter="owner">${choices([['','Todos'],...partners],filters.owner)}</select></label>
    <label>Proyecto<select data-filter="pid">${choices(projectOptions('Todos los proyectos'),filters.pid)}</select></label>
    <label>Período<select data-filter="period">${choices([['7','7 días'],['30','30 días'],['90','90 días']],filters.period)}</select></label>
  </div>`;
  const periodTasks=tasks.filter(t=>t.type==='Compromiso'&&t.original>=start&&t.original<=today());
  const performance=(filters.owner?[filters.owner]:partners).map(owner=>{
    const due=periodTasks.filter(t=>t.owner===owner);
    const done=due.filter(t=>t.status==='Cerrado'&&t.closed&&t.closed<=t.original).length;
    const rate=due.length?Math.round(done*100/due.length):0;
    return `<div class="entry"><strong>${esc(owner)}</strong><div>${done} de ${due.length} cerrados a tiempo · ${due.length?rate+' %':'Sin vencimientos'}</div><div class="meter" aria-hidden="true"><span style="width:${rate}%"></span></div></div>`;
  }).join('');
  const next=tasks.filter(t=>t.type==='Compromiso'&&t.status!=='Cerrado'&&t.due>=today()&&t.due<=end).sort((a,b)=>a.due.localeCompare(b.due));
  const detail=list[view.mode];
  return header('Panel de control','Hola, '+whoShort(db.actor)+'. Consulta el avance de los proyectos y tus decisiones pendientes.')+form+
    `<div class="grid metrics">${Object.keys(list).map(metric).join('')}</div>`+
    (detail?card(detail[0],jump('Volver al resumen','home')+(detail[1].map(detail[2]).join('')||empty('No hay registros para estos filtros.'))):'')+
    `<div class="grid cols">${card('Cumplimiento por responsable',`<small>${dateFmt(start)} al ${dateFmt(today())} · Según el vencimiento original</small>`+performance)}${card('Próximos compromisos',next.map(taskRow).join('')||empty('No hay próximos compromisos con estos filtros.'))}</div>`;
}
function taskRow(t){return row(t.name,`${t.type} · ${taskStatus(t)} · ${dateFmt(t.due)} · ${t.owner}`,'projects','task',t.id)}
function history(items){return items.slice().reverse().map(e=>`<div class="entry"><strong>${esc(e.who)}</strong> <small>${esc(stamp(e.time))}</small><p>${esc(e.msg)}</p></div>`).join('')||empty('Aún no hay actividad.')}
function topicsBlock(kind,id){
  return `<div class="toolbar"><h2>Conversaciones</h2>${button('Abrir tema','topicNew',kind+'|'+id)}</div>`+
    (db.topics.filter(t=>t.kind===kind&&t.ref===id).map(t=>topicRow(t)).join('')||empty('Aún no hay conversaciones.'));
}
function agreements(pid){
  return db.decisions.filter(d=>d.pid===pid&&d.outcome).map(d=>decisionRow(d)).join('')||empty('Aún no hay acuerdos registrados.');
}
function projects(){
  const p=lookup('projects',view.id);
  const t=lookup('tasks',view.id);
  if(view.mode==='task'&&t){
    return jump('Volver a la agenda','projects','agenda')+header(t.name,t.type+' · '+projectName(t.pid))+
      card('Detalle',`<p>${badge(taskStatus(t),overdue(t))}</p><p>Responsable: ${esc(t.owner)}<br>Vencimiento: ${dateFmt(t.due)}<br>Fecha original: ${dateFmt(t.original)}${t.closed?'<br>Cierre: '+dateFmt(t.closed):''}</p><div class="toolbar">${button('Editar','taskEdit',t.id,true)}${(t.pid?jump('Abrir proyecto','projects','project',t.pid):'')}${t.decision?jump('Ver acuerdo','decisions','decision',t.decision):''}</div>`)+(t.history?card('Historial del compromiso',history(t.history)):'');
  }
  if(view.mode==='project'&&p){
    const related=db.tasks.filter(t=>t.pid===p.id).sort((a,b)=>a.due.localeCompare(b.due));
    return jump('Volver a proyectos','projects')+header(p.name,p.goal)+
      `<div class="grid cols">${card('Ficha del proyecto',`<p>${badge(p.status)} ${badge('Prioridad '+p.priority)}</p><p>${esc(p.client)} · ${esc(p.owner)}<br>${dateFmt(p.start)} al ${dateFmt(p.due)}</p>${button('Editar proyecto','projectEdit',p.id)}`)}
      ${card('Hitos y compromisos',(related.map(taskRow).join('')||empty('Aún no hay hitos ni compromisos.'))+`<div class="toolbar">${button('Agregar hito o compromiso','taskNew',p.id,true)}</div>`)}
      <section class="card">${topicsBlock('project',p.id)}</section>${card('Acuerdos y decisiones',agreements(p.id)+db.decisions.filter(d=>d.pid===p.id&&pending(d)).map(decisionRow).join(''))}
      ${card('Casos vinculados',db.cases.filter(c=>c.pid===p.id).map(caseRow).join('')||empty('Sin casos vinculados.'))}
      ${card('Movimientos vinculados',db.money.filter(m=>m.pid===p.id).map(m=>row(m.name,clp(m.amount)+' · '+moneyStatus(m),'finance','money',m.id)).join('')||empty('Sin movimientos vinculados.'))}
      ${p.history?.length?card('Historial del proyecto',history(p.history)):''}
      </div>`;
  }
  const tabs=`<div class="toolbar">${jump('Proyectos','projects')}${jump('Lista de agenda','projects','agenda')}${jump('Calendario','projects','calendar')}</div>`;
  if(['agenda','calendar'].includes(view.mode)){
    const tasks=db.tasks.slice().sort((a,b)=>a.due.localeCompare(b.due));
    return header('Agenda','Vencimientos de hitos y compromisos por proyecto.')+tabs+
      `<div class="toolbar">${button('Agregar hito o compromiso','taskNew','',true)}</div>`+
      (view.mode==='calendar'?calendar(tasks):card('Vencimientos',tasks.map(taskRow).join('')||empty('No hay vencimientos.')));
  }
  return header('Agenda y proyectos','Consulta la cartera y revisa los vencimientos de cada proyecto.')+tabs+
    `<div class="toolbar"><h2>Proyectos</h2>${button('Nuevo proyecto','projectNew','',true)}</div><div class="grid cols">${db.projects.map(p=>`<article class="card"><p>${badge(p.status)} ${badge('Prioridad '+p.priority)}</p><h2>${jump(p.name,'projects','project',p.id)}</h2><p>${esc(p.goal)}</p><small>${esc(p.client)} · ${esc(p.owner)} · ${dateFmt(p.due)}</small></article>`).join('')}</div>`;
}
function calendar(tasks){
  const first=localDate(calendarMonth+'-01');
  const offset=(first.getDay()+6)%7;
  const count=new Date(first.getFullYear(),first.getMonth()+1,0).getDate();
  const days=Array.from({length:count},(_,i)=>{
    const date=shift(i,first);
    return `<div class="day ${date===today()?'today':''}"><strong>${i+1}</strong>${tasks.filter(t=>t.due===date).map(t=>jump(t.name,'projects','task',t.id)).join('')}</div>`;
  }).join('');
  return `<section class="card"><div class="toolbar"><h2>${esc(first.toLocaleDateString('es-CL',{month:'long',year:'numeric'}))}</h2>${button('Mes anterior','month','-1')}${button('Mes actual','month','0')}${button('Mes siguiente','month','1')}</div><div class="calendar">${['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'].map(d=>`<strong>${d}</strong>`).join('')}${'<div></div>'.repeat(offset)}${days}</div></section>`;
}
function caseRow(c){return row(c.name,c.type+' · '+c.status+' · '+c.owner,'cases','case',c.id)}
function cases(){
  const c=lookup('cases',view.id);
  if(c&&view.mode==='case')return jump('Volver a casos','cases')+header(c.name,c.type+' · '+projectName(c.pid))+
    `<div class="grid cols">${card('Ficha del caso',`<p>${badge(c.status)} ${badge('Prioridad '+c.priority)}</p><p>Responsable: ${esc(c.owner)}<br>Fecha objetivo: ${dateFmt(c.due)}</p><h3>Resolución</h3><p>${esc(c.resolution||'Pendiente')}</p><div class="toolbar">${button('Editar caso o cambiar estado','caseEdit',c.id,true)}${c.pid?jump('Abrir proyecto','projects','project',c.pid):''}</div>`)}
      ${card('Historial del caso',button('Comentar caso','caseComment',c.id)+history(c.history))}<section class="card">${topicsBlock('case',c.id)}</section></div>`;
  return header('Gestión de casos','Consulta incidencias, solicitudes, mejoras y asuntos internos.')+
    `<div class="toolbar"><h2>Casos registrados</h2>${button('Abrir caso','caseNew','',true)}</div><div class="card">${db.cases.map(caseRow).join('')||empty('Sin casos registrados.')}</div>`;
}
const incoming=m=>['Ingreso','Aporte'].includes(m.type);
const signed=m=>incoming(m)?m.amount:-m.amount;
const sum=items=>items.reduce((total,m)=>total+signed(m),0);
const moneyStatus=m=>m.status==='Efectivo'?(incoming(m)?'Efectivo · Cobrado':'Efectivo · Pagado'):m.status;
function finance(){
  const m=lookup('money',view.id);
  const can=db.actor===camilo;
  if(m&&view.mode==='money'){
    const financeAction=m.status==='Proyectado'?'Aprobar movimiento':incoming(m)?'Marcar como cobrado':'Marcar como pagado';
    return jump('Volver a finanzas','finance')+header(m.name,projectName(m.pid))+
      `<div class="grid cols">${card('Detalle del movimiento',`<p>${badge(moneyStatus(m))}</p><h2 class="amount">${clp(m.amount)}</h2><p>${esc(m.type)} · ${esc(m.category)} · ${dateFmt(m.date)}</p><p>Respaldo: ${esc(m.ref)}</p><div class="toolbar">${can&&m.status!=='Efectivo'?button(financeAction,'financeNext',m.id,true):''}${m.pid?jump('Abrir proyecto','projects','project',m.pid):''}</div>`)}
      ${card('Historial financiero',history(m.history))}<section class="card">${topicsBlock('money',m.id)}</section></div>`;
  }
  const effective=db.money.filter(m=>m.status==='Efectivo');
  const total=(label,value)=>`<div class="card metric"><span>${label}</span><strong class="amount">${clp(value)}</strong></div>`;
  const result=(pid,status)=>clp(sum(db.money.filter(m=>m.pid===pid&&m.status===status&&m.type!=='Aporte')));
  return header('Finanzas internas','Seguimiento de ingresos, gastos, costos y aportes de socios en pesos chilenos.')+
    `<div class="grid metrics">${total('Saldo efectivo',sum(effective))}${total('Ingresos comerciales cobrados',sum(effective.filter(m=>m.type==='Ingreso')))}${total('Aportes de socios recibidos',sum(effective.filter(m=>m.type==='Aporte')))}${total('Gastos y costos pagados',-sum(effective.filter(m=>!incoming(m))))}</div>
    <div class="toolbar"><h2>Movimientos</h2>${can?button('Registrar movimiento','financeNew','',true):'<small>Camilo registra y valida movimientos.</small>'}</div>
    <section class="card">${table(['Movimiento','Tipo','Proyecto','Fecha','Monto','Estado'],db.money.map(m=>[jump(m.name,'finance','money',m.id),esc(m.type),esc(projectName(m.pid)),dateFmt(m.date),`<span class="amount">${clp(m.amount)}</span>`,badge(moneyStatus(m))]))}</section>
    <div class="details">${card('Resultado por proyecto',table(['Proyecto','Proyectado','Comprometido','Efectivo'],db.projects.map(p=>[jump(p.name,'projects','project',p.id),result(p.id,'Proyectado'),result(p.id,'Comprometido'),result(p.id,'Efectivo')])))}</div>`;
}
function topicRow(t){return row(t.title,t.messages.length+' mensaje(s) · '+t.by,'decisions','topic',t.id)}
function decisionStatus(d){return d.outcome||(Object.values(d.responses).some(r=>r.vote==='Pide antecedentes')?'Pendiente · Antecedentes solicitados':'Pendiente')}
function decisionRow(d){return row(d.title,decisionStatus(d)+' · '+dateFmt(d.due)+' · '+projectName(d.pid),'decisions','decision',d.id)}
function decisions(){
  const t=lookup('topics',view.id);
  const d=lookup('decisions',view.id);
  if(t&&view.mode==='topic'){
    const s=scope(t.kind,t.ref);
    const related=db.decisions.filter(d=>d.topic===t.id);
    const messages=t.messages.map(e=>`<div class="entry"><strong>${esc(e.who)}</strong> <small>${esc(stamp(e.time))}</small><p>${esc(e.msg)}</p>${e.mentions?.map(name=>badge('@'+name)).join(' ')||''}</div>`).join('');
    return jump(s.label,s.page,s.mode,s.id)+header(t.title,'Conversación · '+s.label)+
      `<div class="grid cols">${card('Mensajes',messages+`<div class="toolbar">${button('Responder','reply',t.id,true)}</div>`)}
      ${card('Solicitudes vinculadas',(related.map(decisionRow).join('')||empty('Aún no se han abierto solicitudes.'))+`<div class="toolbar">${button('Crear solicitud de decisión','decisionNew',t.id,true)}</div>`)}</div>`;
  }
  if(d&&view.mode==='decision'){
    const topic=lookup('topics',d.topic);
    const ready=d.invited.every(who=>d.responses[who]&&d.responses[who].vote!=='Pide antecedentes');
    const votes=d.invited.map(who=>{
      const r=d.responses[who];
      return `<div class="entry"><strong>${esc(who)}</strong><div>${badge(r?.vote||'Sin respuesta')} ${r?'<small>'+esc(stamp(r.time))+'</small>':''}</div>${r?.note?'<p>'+esc(r.note)+'</p>':''}</div>`;
    }).join('');
    return jump('Volver a decisiones','decisions')+header(d.title,projectName(d.pid))+
      `<div class="grid cols">${card('Solicitud',`<p>${badge(decisionStatus(d))}</p><p>${esc(d.proposal)}</p><p>Solicita: ${esc(d.by)}<br>A cargo: ${esc(d.owner)}<br>Plazo: ${dateFmt(d.due)}</p><div class="toolbar">${jump('Leer antecedentes y comentar','decisions','topic',d.topic)}${topic&&scope(topic.kind,topic.ref).pid?jump('Abrir proyecto','projects','project',d.pid):''}</div>`)}
      ${card('Respuestas de los convocados',votes+`<div class="toolbar">${pending(d)&&d.invited.includes(db.actor)?button('Registrar respuesta','vote',d.id,true):''}${pending(d)&&ready?button('Cerrar y registrar acuerdo','resolve',d.id,true):''}</div>`+(pending(d)?'<small>La demo habilita el cierre con una respuesta definitiva de cada convocado. Umbrales de aprobación por definir entre los socios.</small>':''))}
      ${d.outcome?card('Acuerdo registrado',`<p>${badge(d.outcome)}</p><p>${esc(d.resolution)}</p><p>Registrado por ${esc(d.closedBy)} · ${esc(stamp(d.closedAt))}<br>A cargo: ${esc(d.owner)}</p>${d.task?jump('Ver compromiso en la agenda','projects','task',d.task):button('Enviar compromiso a la agenda','agreementTask',d.id,true)}`):''}
      ${d.history.length?card('Historial de la solicitud',history(d.history)):''}</div>`;
  }
  const waiting=db.decisions.filter(d=>awaits(d));
  return header('Conversaciones y decisiones','Coordina con los socios y conserva el registro de cada solicitud y acuerdo.')+
    `<div class="grid cols"><section class="card">${topicsBlock('general','')}</section>
    ${card('Mis respuestas pendientes',waiting.map(decisionRow).join('')||empty('No tienes respuestas pendientes.'))}
    ${card('Solicitudes abiertas',db.decisions.filter(pending).map(decisionRow).join('')||empty('No hay solicitudes abiertas.'))}
    ${card('Acuerdos registrados',db.decisions.filter(d=>d.outcome).map(decisionRow).join('')||empty('No hay acuerdos registrados.'))}
    ${card('Conversaciones vinculadas',db.topics.filter(t=>t.kind!=='general').map(topicRow).join('')||empty('No hay conversaciones vinculadas.'))}</div>`;
}
const screens={home:dashboard,projects,cases,finance,decisions};
function render(){
  $('actor').innerHTML=choices(partners,db.actor);
  $('nav').innerHTML=Object.entries(modules).map(([page,[icon,label]])=>`<button data-jump="${hashFor(page)}"${page===view.page?' aria-current="page"':''}><span class="icon" aria-hidden="true">${icon}</span>${label}</button>`).join('');
  $('main').innerHTML=screens[view.page]();
}
const field=(label,name,value='',type='text',required=true)=>`<label>${esc(label)}<input name="${name}" type="${type}" value="${esc(value)}"${type==='number'?' min="1" step="1"':''}${required?' required':''}></label>`;
const select=(label,name,options,value='',required=true)=>`<label>${esc(label)}<select name="${name}"${required?' required':''}>${choices(options,value)}</select></label>`;
const area=(label,name,value='',required=true)=>`<label>${esc(label)}<textarea name="${name}"${required?' required':''}>${esc(value)}</textarea></label>`;
const checks=(label,name,options)=>`<fieldset><legend>${esc(label)}</legend>${options.map(option=>`<label><input type="checkbox" name="${name}" value="${esc(option)}"> ${esc(option)}</label>`).join('')}</fieldset>`;
const ownerField=(value=db.actor)=>select('Responsable','owner',partners,value);
const priorityField=(value='Media')=>select('Prioridad','priority',['Baja','Media','Alta','Urgente'],value);
const event=msg=>({who:db.actor,time:now(),msg});
function modal(title,fields,save,label='Guardar'){
  const dialog=$('dialog');
  dialog.innerHTML=`<h2 id="dialog-title">${esc(title)}</h2><form>${fields}<p class="alert" role="alert" id="error"></p><div class="toolbar"><button type="button" class="btn" id="cancel">Cancelar</button><button class="btn primary" type="submit">${esc(label)}</button></div></form>`;
  dialog.setAttribute('aria-labelledby','dialog-title');
  $('cancel').onclick=()=>dialog.close();
  dialog.querySelector('form').onsubmit=e=>{
    e.preventDefault();
    const form=new FormData(e.currentTarget);
    const values=Object.fromEntries([...form].map(([key,value])=>[key,value.trim()]));
    if([...e.currentTarget.querySelectorAll('input[required], textarea[required]')].some(input=>!input.value.trim())){
      $('error').textContent='Completa los campos obligatorios.';
      return;
    }
    const result=save(values,form);
    if(typeof result==='string')$('error').textContent=result;
    else dialog.close();
  };
  dialog.showModal();
}
function finish(page,mode,id,message){
  update(message);go(page,mode,id);
}
function editProject(p){
  modal(p?'Editar proyecto':'Nuevo proyecto',
    field('Nombre','name',p?.name)+field('Cliente o iniciativa interna','client',p?.client)+area('Objetivo','goal',p?.goal)+ownerField(p?.owner)+priorityField(p?.priority)+
    select('Estado','status',['Planificado','Activo','En pausa','Cerrado'],p?.status||'Activo')+field('Fecha de inicio','start',p?.start||today(),'date')+field('Fecha objetivo','due',p?.due||shift(15),'date'),
    v=>{
      if(v.start>v.due)return 'La fecha objetivo debe ser igual o posterior al inicio.';
      const id=p?.id||uid();
      if(p)Object.assign(p,v,{history:[...(p.history||[]),event('Actualizó la ficha del proyecto. Estado: '+v.status+'.')]});else db.projects.push({...v,id,history:[event('Creó el proyecto.')]});
      finish('projects','project',id,'Proyecto guardado.');
    });
}
function editTask(t,pid=''){
  modal(t?'Editar hito o compromiso':'Agregar hito o compromiso',
    field('Nombre','name',t?.name)+select('Proyecto','pid',projectOptions('Sin proyecto'),t?.pid||pid,false)+
    select('Tipo','type',['Hito','Compromiso'],t?.type||'Compromiso')+ownerField(t?.owner)+field('Vencimiento','due',t?.due||shift(7),'date')+
    select('Estado','status',['Pendiente','En curso','Cerrado'],t?.status||'Pendiente'),
    v=>{
      const id=t?.id||uid();
      const closed=v.status==='Cerrado'?(t?.closed||today()):'';
      const notes=t?.due&&t.due!==v.due?`Reprogramó el vencimiento del ${dateFmt(t.due)} al ${dateFmt(v.due)}. Estado: ${v.status}.`:`Guardó el registro. Estado: ${v.status}.`;
      if(t?.decision&&t.pid!==v.pid)return 'El compromiso de un acuerdo debe permanecer en su proyecto.';
      if(t)Object.assign(t,v,{closed,history:[...(t.history||[]),event(notes)]});
      else db.tasks.push({...v,id,original:v.due,closed,history:[event(notes)]});
      finish('projects','task',id,'Agenda actualizada.');
    });
}
function editCase(c){
  modal(c?'Editar caso':'Abrir caso',
    field('Asunto','name',c?.name)+select('Tipo','type',['Incidencia','Solicitud','Mejora','Asunto interno'],c?.type||'Incidencia')+
    select('Proyecto','pid',projectOptions('Sin proyecto'),c?.pid||'',false)+ownerField(c?.owner)+priorityField(c?.priority)+
    field('Fecha objetivo','due',c?.due||shift(7),'date')+select('Estado','status',['Abierto','En curso','En espera','Resuelto','Cerrado'],c?.status||'Abierto')+
    area('Resolución','resolution',c?.resolution||'',false),
    v=>{
      if(['Resuelto','Cerrado'].includes(v.status)&&!v.resolution)return 'Ingresa la resolución del caso.';
      const id=c?.id||uid();
      if(c){
        const changes=Object.entries({name:'Asunto',type:'Tipo',owner:'Responsable',priority:'Prioridad',due:'Fecha objetivo',status:'Estado',resolution:'Resolución',pid:'Proyecto'})
          .filter(([key])=>v[key]!==c[key])
          .map(([key,label])=>`${label}: ${key==='pid'?projectName(v[key]):v[key]||'Sin valor'}`).join(' · ');
        if(changes)c.history.push(event(changes));
        Object.assign(c,v);
      }else db.cases.push({...v,id,history:[event('Abrió el caso. Estado: '+v.status+'.')]});
      finish('cases','case',id,'Caso guardado.');
    });
}
function registerMoney(){
  if(db.actor!==camilo)return;
  modal('Registrar movimiento',field('Concepto','name')+select('Tipo','type',['Ingreso','Gasto','Costo','Aporte'],'Gasto')+
    field('Monto en pesos chilenos','amount','','number')+field('Fecha','date',today(),'date')+field('Categoría','category')+
    select('Proyecto','pid',projectOptions('Sin proyecto'),'',false)+field('Referencia a respaldo ficticio','ref'),
    v=>{
      const amount=Number(v.amount);
      if(!Number.isSafeInteger(amount)||amount<1)return 'Ingresa un monto entero positivo en pesos chilenos.';
      const id=uid();
      db.money.push({...v,id,amount,status:'Proyectado',history:[event('Registró el movimiento proyectado.')]});
      finish('finance','money',id,'Movimiento registrado.');
    });
}
function advanceMoney(m){
  if(!m||db.actor!==camilo||m.status==='Efectivo')return;
  const approve=m.status==='Proyectado';
  const title=approve?'Aprobar movimiento':incoming(m)?'Marcar como cobrado':'Marcar como pagado';
  const status=approve?'Comprometido':'Efectivo';
  modal(title,`<p>${esc(m.name)} · ${clp(m.amount)}</p>`+area('Nota para el historial','note','',false),v=>{
    m.status=status;
    m.history.push(event((approve?'Aprobó el movimiento y lo dejó comprometido.':incoming(m)?'Marcó el movimiento como cobrado.':'Marcó el movimiento como pagado.')+(v.note?' '+v.note:'')));
    update('Estado financiero actualizado.');
  },title);
}
function newTopic(kind,ref){
  modal('Abrir tema',field('Título','title')+area('Mensaje','msg')+checks('Mencionar a socios','mentions',partners), (v,f)=>{
    const id=uid();
    db.topics.push({id,kind,ref,title:v.title,by:db.actor,time:now(),messages:[{...event(v.msg),mentions:f.getAll('mentions')}]});
    finish('decisions','topic',id,'Tema abierto.');
  });
}
function reply(t){
  modal('Responder',area('Mensaje','msg')+checks('Mencionar a socios','mentions',partners),(v,f)=>{
    t.messages.push({...event(v.msg),mentions:f.getAll('mentions')});update('Respuesta publicada.');
  },'Publicar respuesta');
}
function newDecision(t){
  const s=scope(t.kind,t.ref);
  modal('Crear solicitud de decisión',field('Título','title',t.kind==='money'?'Autorizar '+s.label.charAt(0).toLowerCase()+s.label.slice(1):'')+
    area('Propuesta concreta','proposal')+checks('Socios convocados','invited',partners)+field('Plazo de respuesta','due',shift(3),'date')+
    select('Persona a cargo','owner',partners,db.actor)+(s.pid?`<p><small>Proyecto vinculado: ${esc(projectName(s.pid))}</small></p>`:select('Proyecto','pid',projectOptions('Sin proyecto'),'',false)),
    (v,f)=>{
      const invited=f.getAll('invited');
      if(!invited.length)return 'Convoca al menos a un socio.';
      const id=uid();
      db.decisions.push({id,topic:t.id,title:v.title,proposal:v.proposal,due:v.due,owner:v.owner,by:db.actor,pid:s.pid||v.pid,invited,responses:{},outcome:'',history:[event('Abrió la solicitud de decisión.')]});
      finish('decisions','decision',id,'Solicitud creada.');
    },'Crear solicitud');
}
function vote(d){
  if(!pending(d)||!d.invited.includes(db.actor))return;
  modal('Registrar respuesta',select('Respuesta','vote',['Aprueba','Rechaza','Pide antecedentes'],d.responses[db.actor]?.vote||'Aprueba')+area('Comentario o antecedentes solicitados','note',d.responses[db.actor]?.note||'',false),v=>{
    if(v.vote==='Pide antecedentes'&&!v.note)return 'Indica qué antecedentes necesitas.';
    d.responses[db.actor]={...v,time:now()};
    d.history.push(event(v.vote+(v.note?' · '+v.note:'')));
    update('Respuesta registrada.');
  });
}
function addAgreementTask(d,v){
  const id=uid();
  d.task=id;
  db.tasks.push({id,pid:d.pid,decision:d.id,name:v.taskName,type:'Compromiso',owner:d.owner,due:v.taskDue,original:v.taskDue,status:'Pendiente',closed:'',history:[event('Creó el compromiso desde el acuerdo.')]});
  d.history.push(event('Envió el compromiso a la agenda.'));
}
const taskFields=(d,required)=>field('Nombre del compromiso','taskName',d.title,'text',required)+field('Vencimiento del compromiso','taskDue',shift(5),'date',required);
function resolve(d){
  if(!pending(d)||!d.invited.every(who=>d.responses[who]&&d.responses[who].vote!=='Pide antecedentes'))return;
  const defaultOutcome=d.invited.every(who=>d.responses[who].vote==='Aprueba')?'Aprobado':d.invited.every(who=>d.responses[who].vote==='Rechaza')?'Rechazado':'';
  modal('Cerrar y registrar acuerdo',select('Resultado acordado','outcome',[['','Selecciona un resultado'],'Aprobado','Rechazado','Cerrado con acuerdo alternativo'],defaultOutcome)+
    area('Qué se resolvió','resolution')+select('Persona a cargo','owner',partners,d.owner)+
    (`<fieldset><legend>Compromiso en la agenda</legend><label><input type="checkbox" name="createTask" checked> Enviar compromiso al cerrar</label>${taskFields(d,false)}</fieldset>`),
    v=>{
      if(v.createTask&&(!v.taskName||!v.taskDue))return 'Completa el nombre y vencimiento del compromiso.';
      Object.assign(d,{outcome:v.outcome,resolution:v.resolution,owner:v.owner,closedBy:db.actor,closedAt:now()});
      d.history.push(event('Registró el acuerdo. Resultado: '+v.outcome+'.'));
      if(v.createTask)addAgreementTask(d,v);
      update(v.createTask?'Acuerdo registrado y compromiso agregado a la agenda.':'Acuerdo registrado.');
    },'Registrar acuerdo');
}
function agreementTask(d){
  if(!d.outcome||d.task)return;
  modal('Enviar compromiso a la agenda',taskFields(d,true),v=>{
    addAgreementTask(d,v);update('Compromiso agregado a la agenda.');
  });
}
const actions={
  projectNew:()=>editProject(),
  projectEdit:id=>editProject(lookup('projects',id)),
  taskNew:pid=>editTask(null,pid),
  taskEdit:id=>editTask(lookup('tasks',id)),
  caseNew:()=>editCase(),
  caseComment:id=>{
    const c=lookup('cases',id);
    modal('Comentar caso',area('Comentario','msg'),v=>{
      c.history.push(event(v.msg));update('Comentario registrado.');
    },'Publicar comentario');
  },
  caseEdit:id=>editCase(lookup('cases',id)),
  financeNew:registerMoney,
  financeNext:id=>advanceMoney(lookup('money',id)),
  topicNew:id=>newTopic(...id.split('|')),
  reply:id=>reply(lookup('topics',id)),
  decisionNew:id=>newDecision(lookup('topics',id)),
  vote:id=>vote(lookup('decisions',id)),
  resolve:id=>resolve(lookup('decisions',id)),
  agreementTask:id=>agreementTask(lookup('decisions',id)),
  month:id=>{
    const current=localDate(calendarMonth+'-01');
    current.setMonth(current.getMonth()+Number(id));
    calendarMonth=id==='0'?today().slice(0,7):iso(current).slice(0,7);
    render();
  },
  reset:()=>modal('Restaurar datos de ejemplo','<p>Se borrarán los cambios guardados en este navegador y se cargarán los registros ficticios iniciales.</p>',()=>{
    db=seed();filters={owner:'',pid:'',period:'30'};calendarMonth=today().slice(0,7);
    finish('home','','','Datos de ejemplo restaurados.');
  },'Restaurar')
};
document.addEventListener('click',e=>{
  const element=e.target.closest('button');
  if(!element)return;
  if(element.dataset.jump){
    const [page,mode,id]=element.dataset.jump.slice(1).split('/');
    go(page,mode,id);
  }
  if(element.dataset.action)actions[element.dataset.action]?.(element.dataset.id);
});
document.addEventListener('change',e=>{
  if(e.target.id==='actor'){
    db.actor=e.target.value;
    update();
    $('actor').focus();
  }
  if(e.target.dataset.filter){
    const filter=e.target.dataset.filter;
    filters[filter]=e.target.value;
    render();
    document.querySelector('[data-filter="'+filter+'"]').focus();
  }
});
window.addEventListener('hashchange',()=>{route();window.scrollTo(0,0)});
route();
</script>
</body>
</html>
